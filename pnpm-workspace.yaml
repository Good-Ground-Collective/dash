packages:
  - apps/*
  - packages/*

catalog:
  '@eslint-community/eslint-plugin-eslint-comments': 4.8.1
  '@fontsource-variable/geist': 5.3.0
  '@fontsource-variable/geist-mono': 5.3.0
  '@good-ground-collective/preflight': 0.7.0
  '@internationalized/date': 3.12.4
  '@playwright/test': 1.65.1
  '@sveltejs/adapter-node': 6.0.5
  '@sveltejs/kit': 3.4.0
  '@sveltejs/vite-plugin-svelte': 7.3.2
  '@types/node': 24.19.2
  '@typescript-eslint/eslint-plugin': 8.74.0
  '@typescript-eslint/parser': 8.74.0
  bits-ui: 2.22.0
  eslint: 10.15.0
  eslint-plugin-import-x: 4.18.1
  eslint-plugin-unicorn: 80.0.0
  prettier: 3.10.1
  prettier-plugin-svelte: 4.2.0
  stylelint: 18.1.0
  stylelint-config-standard: 41.1.0
  svelte: 5.59.1
  svelte-check: 4.7.8
  turbo: 2.11.13
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.1
  zod: 4.6.7

# First-party packages skip the release-age delay so preflight releases apply immediately.
minimumReleaseAgeExclude:
  - '@good-ground-collective/preflight'
