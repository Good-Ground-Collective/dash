# Dash settings for dash-db, layered over Debian's postgresql.conf through its
# conf.d include. Installed by provision.sh; edit here, not on the box.
# Sized for a 1 GB Nanode that runs nothing else.

# Localhost and the tailnet only. The cloud firewall drops 5432 anyway.
listen_addresses = 'localhost,@TAILNET_IP@'
port = 5432
max_connections = 50
password_encryption = scram-sha-256

# Memory
shared_buffers = 256MB
effective_cache_size = 640MB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = off

# Disk is SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and archiving through pgBackRest to Linode Object Storage
wal_level = replica
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'pgbackrest --stanza=dash archive-push %p'
# Bounds data loss on a quiet database to about 15 minutes.
archive_timeout = 900

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
