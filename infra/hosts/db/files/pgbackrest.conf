# Installed by provision.sh. No secrets here: the repo key and the cipher
# passphrase live in /etc/pgbackrest/conf.d/dash-secrets.conf (root:postgres,
# 640), which pgBackRest merges in from its default include path.
#
# The repo is Linode Object Storage, reached through its S3-compatible API.
# pgBackRest calls that repo type "s3"; no AWS account is involved.

[global]
repo1-type=s3
repo1-s3-endpoint=us-southeast-1.linodeobjects.com
repo1-s3-region=us-southeast-1
repo1-s3-bucket=dash-pg-backups
repo1-s3-uri-style=host
repo1-path=/dash-db
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
process-max=1
start-fast=y
log-level-console=info
log-level-file=detail

[global:archive-push]
compress-level=3

[dash]
pg1-path=/var/lib/postgresql/18/main
pg1-socket-path=/var/run/postgresql
