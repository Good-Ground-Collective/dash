# Installed by provision.sh; edit infra/hosts/db/files/pg_hba.conf, not the box.
# TYPE  DATABASE         USER             ADDRESS          METHOD

# Local Unix socket: OS user must match the role (postgres, root via runuser).
local   all              all                               peer

# Mission Control over Tailscale. Only the app role, only its database.
host    mission_control  mission_control  100.64.0.0/10    scram-sha-256
