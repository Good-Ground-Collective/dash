name: dash-mission-control

services:
  postgres:
    image: postgres:18-alpine
    container_name: dash-mission-control-postgres
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: mission_control
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - dash-mission-control-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dash -d mission_control']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  dash-mission-control-pgdata:
    name: dash-mission-control-pgdata
