name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: shellcheck -x infra/hosts/db/*.sh infra/hosts/db/remote/*.sh infra/hosts/db/files/bin/*

      - run: shellcheck -x bin/deploy-gate bin/image bin/image-secret-scan bin/kamal bin/test-deploy-gate bin/test-image-secret-scan apps/mission-control/bin/dash

      - run: bin/test-deploy-gate

      - run: infra/hosts/db/test-alerts.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configure registry auth
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: bin/test-release-notes

      - run: pnpm format:check

      - name: Verify affected packages
        if: github.event_name == 'pull_request'
        run: pnpm turbo run lint typecheck test build --affected

      - name: Verify all packages
        if: github.event_name == 'push'
        run: pnpm turbo run lint typecheck test build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @dash/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dash/web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @dash/web exec playwright install-deps chromium

      - name: End-to-end test affected packages
        if: github.event_name == 'pull_request'
        run: pnpm turbo run test:e2e --affected

      - name: End-to-end test all packages
        if: github.event_name == 'push'
        run: pnpm turbo run test:e2e

  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - run: shellcheck bootstrap.sh tofu.sh

      - run: tofu fmt -check -recursive

      - run: tofu init -backend=false -input=false -lockfile=readonly

      - run: tofu validate

  image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [web, mission-control]
    services:
      postgres:
        image: ${{ matrix.app == 'mission-control' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: dash
          POSTGRES_PASSWORD: dash
          POSTGRES_DB: mission_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dash -d mission_control"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP: ${{ matrix.app }}
      BOOT_DATABASE_URL: postgres://dash:dash@127.0.0.1:5432/mission_control
      BOOT_AUTH_SECRET: image-check-throwaway-secret-not-for-deploys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check for image changes
        id: changes
        run: |
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          pattern='^(apps|packages|integrations)/|(^|/)Dockerfile$|^\.dockerignore$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|tsconfig\.json)$|^bin/(image|lib/)|^\.github/workflows/ci\.yml$'
          if grep -qE "$pattern" <<<"$changed"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Image check skipped::No change in this pull request can affect the $APP image."
          fi

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        if: steps.changes.outputs.build == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.build == 'true'

      - name: Build and scan
        if: steps.changes.outputs.build == 'true'
        run: bin/image "$APP"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_CACHE_FROM: type=gha,scope=image-${{ matrix.app }}
          IMAGE_CACHE_TO: type=gha,mode=max,scope=image-${{ matrix.app }}
          DASH_BETTER_AUTH_SECRET: ${{ env.BOOT_AUTH_SECRET }}
          DASH_DATABASE_URL: ${{ env.BOOT_DATABASE_URL }}

      - name: Boot
        if: steps.changes.outputs.build == 'true'
        run: |
          args=(--detach --name "$APP" --network host)
          if [[ $APP == mission-control ]]; then
            args+=(-e DATABASE_URL="$BOOT_DATABASE_URL" -e BETTER_AUTH_SECRET="$BOOT_AUTH_SECRET" -e BETTER_AUTH_URL=https://api.dash.doublel.studio -e PGSSLMODE=disable)
            args+=(-e GITHUB_APP_ID=1 -e GITHUB_APP_SLUG=image-check -e GITHUB_APP_CLIENT_ID=image-check -e GITHUB_APP_CLIENT_SECRET=image-check -e GITHUB_WEBHOOK_SECRET=image-check)
            args+=(-e GITHUB_APP_PRIVATE_KEY="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)")
          else
            args+=(-e ORIGIN=http://127.0.0.1:3000 -e API_BASE_URL=https://api.dash.doublel.studio)
          fi
          docker run "${args[@]}" "ghcr.io/good-ground-collective/dash-$APP:$(git rev-parse HEAD)"
          if curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:3000/healthz; then
            echo
            echo "$APP /healthz ok"
          else
            docker logs "$APP"
            exit 1
          fi

  release:
    needs: [shellcheck, verify, tofu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configure registry auth
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read released version
        id: version
        run: echo "version=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

  images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, mission-control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          if [[ -z $DASH_BETTER_AUTH_SECRET || -z $DASH_DATABASE_URL ]]; then
            echo "::error::The production environment needs DASH_BETTER_AUTH_SECRET and DASH_DATABASE_URL so the image scan covers them. See README.md, Deploys."
            exit 1
          fi
          bin/image "$APP" --push --tag "$VERSION"
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PUSH_USERNAME: ${{ github.actor }}
          GHCR_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASH_BETTER_AUTH_SECRET: ${{ secrets.DASH_BETTER_AUTH_SECRET }}
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          DASH_GITHUB_APP_CLIENT_SECRET: ${{ secrets.DASH_GITHUB_APP_CLIENT_SECRET }}
          DASH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DASH_GITHUB_APP_PRIVATE_KEY }}
          DASH_GITHUB_WEBHOOK_SECRET: ${{ secrets.DASH_GITHUB_WEBHOOK_SECRET }}

  deploy:
    needs: [release, images]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dash.doublel.studio
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      READY: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' && secrets.DASH_DEPLOY_SSH_KEY != '' && vars.DASH_APP_SSH_HOST_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deploy is current and configured
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")')
          status=0
          latest=$(bin/deploy-gate "$VERSION" <<<"$tags") || status=$?
          if ((status == 3)); then
            echo "::notice title=Deploy skipped::$VERSION is not the newest release, $latest is. Deploying it would roll production back; re-run the run for $latest instead."
          elif ((status != 0)); then
            echo "::error title=Deploy blocked::Could not tell whether $VERSION is the newest release."
            exit "$status"
          elif [[ $READY != true ]]; then
            echo "::notice title=Deploy skipped::$VERSION is released and its images are pushed, but the production environment lacks one of TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET or DASH_DEPLOY_SSH_KEY, or the DASH_APP_SSH_HOST_KEY variable is unset. See README.md, Deploys."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read host
        id: host
        if: steps.gate.outputs.go == 'true'
        run: echo "address=$(yq '.servers.web.hosts[0]' deploy/web.yml)" >> "$GITHUB_OUTPUT"

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        if: steps.gate.outputs.go == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ steps.host.outputs.address }}

      - name: Load deploy key
        if: steps.gate.outputs.go == 'true'
        run: |
          export SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock
          ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          ssh-add -q - <<<"$DASH_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          while IFS= read -r key; do
            [[ -z $key ]] || printf '%s %s\n' "$HOST" "$key" >> ~/.ssh/known_hosts
          done <<<"$HOST_KEY"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "dash@$HOST" true
        env:
          DASH_DEPLOY_SSH_KEY: ${{ secrets.DASH_DEPLOY_SSH_KEY }}
          HOST: ${{ steps.host.outputs.address }}
          HOST_KEY: ${{ vars.DASH_APP_SSH_HOST_KEY }}

      - name: Deploy Mission Control
        if: steps.gate.outputs.go == 'true'
        run: bin/kamal deploy -c deploy/mission-control.yml --skip-push --version "$VERSION"
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DASH_BETTER_AUTH_SECRET: ${{ secrets.DASH_BETTER_AUTH_SECRET }}
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          DASH_GITHUB_APP_ID: ${{ vars.DASH_GITHUB_APP_ID }}
          DASH_GITHUB_APP_SLUG: ${{ vars.DASH_GITHUB_APP_SLUG }}
          DASH_GITHUB_APP_CLIENT_ID: ${{ vars.DASH_GITHUB_APP_CLIENT_ID }}
          DASH_GITHUB_APP_CLIENT_SECRET: ${{ secrets.DASH_GITHUB_APP_CLIENT_SECRET }}
          DASH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DASH_GITHUB_APP_PRIVATE_KEY }}
          DASH_GITHUB_WEBHOOK_SECRET: ${{ secrets.DASH_GITHUB_WEBHOOK_SECRET }}

      - name: Deploy web
        if: steps.gate.outputs.go == 'true'
        run: bin/kamal deploy -c deploy/web.yml --skip-push --version "$VERSION"
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DASH_BETTER_AUTH_SECRET: ${{ secrets.DASH_BETTER_AUTH_SECRET }}
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          DASH_GITHUB_APP_ID: ${{ vars.DASH_GITHUB_APP_ID }}
          DASH_GITHUB_APP_SLUG: ${{ vars.DASH_GITHUB_APP_SLUG }}
          DASH_GITHUB_APP_CLIENT_ID: ${{ vars.DASH_GITHUB_APP_CLIENT_ID }}
          DASH_GITHUB_APP_CLIENT_SECRET: ${{ secrets.DASH_GITHUB_APP_CLIENT_SECRET }}
          DASH_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DASH_GITHUB_APP_PRIVATE_KEY }}
          DASH_GITHUB_WEBHOOK_SECRET: ${{ secrets.DASH_GITHUB_WEBHOOK_SECRET }}

      - name: Smoke check
        if: steps.gate.outputs.go == 'true'
        run: |
          for url in https://api.dash.doublel.studio/healthz https://dash.doublel.studio/healthz; do
            curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 5 --retry-all-errors --max-time 10 "$url"
            echo "$url ok"
          done
